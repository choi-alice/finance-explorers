<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #242320;
    --border: #2e2d2a;
    --text: #f0ede6;
    --text-muted: #7a7870;
    --text-dim: #4a4845;
    --green: #4ade80;
    --green-dim: #166534;
    --blue: #60a5fa;
    --blue-mid: #1d4ed8;
    --blue-light: #93c5fd;
    --accent: #f59e0b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .container { max-width: 820px; margin: 0 auto; }

  header { margin-bottom: 48px; }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 8px;
  }
  header h1 em { font-style: italic; color: var(--accent); }
  header p { font-size: 13px; color: var(--text-muted); letter-spacing: 0.05em; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 16px;
  }

  .panel-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .ctrl { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .ctrl:last-child { margin-bottom: 0; }
  .ctrl label {
    font-size: 12px;
    color: var(--text-muted);
    width: 140px;
    flex-shrink: 0;
    letter-spacing: 0.03em;
  }
  .ctrl input[type=range] {
    flex: 1;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .ctrl input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .ctrl .val {
    font-size: 13px;
    font-weight: 500;
    width: 100px;
    min-width: 100px;
    text-align: right;
    color: var(--text);
    flex-shrink: 0;
    letter-spacing: -0.01em;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 14px;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .stat-value { font-size: 16px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
  .stat-value.green { color: var(--green); }
  .stat-value.blue { color: var(--blue-light); }

  .legend {
    display: flex;
    gap: 20px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 12px;
    letter-spacing: 0.03em;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .chart-wrap {
    position: relative;
    width: 100%;
    height: 300px;
  }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .ctrl label { width: 110px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Compound <em>interest</em><br>explorer</h1>
    <p>// watch your money grow over time</p>
  </header>

  <div class="panel">
    <div class="panel-title">Parameters</div>
    <div class="ctrl">
      <label>Initial deposit</label>
      <input type="range" id="principal" min="0" max="1000000" step="10000" value="100000">
      <span class="val" id="pOut">$100,000</span>
    </div>
    <div class="ctrl">
      <label>Annual contribution</label>
      <input type="range" id="contrib" min="0" max="100000" step="1000" value="10000">
      <span class="val" id="cOut">$10,000</span>
    </div>
    <div class="ctrl">
      <label>Annual rate</label>
      <input type="range" id="rate" min="1" max="15" step="0.5" value="7">
      <span class="val" id="rOut">7%</span>
    </div>
    <div class="ctrl">
      <label>Years</label>
      <input type="range" id="years" min="1" max="40" step="1" value="20">
      <span class="val" id="yOut">20 yrs</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Initial deposit</div>
      <div class="stat-value" id="statPrincipal">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total contributed</div>
      <div class="stat-value blue" id="statContrib">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Interest earned</div>
      <div class="stat-value green" id="statInterest">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Final balance</div>
      <div class="stat-value" id="statFinal">—</div>
    </div>
  </div>

  <div class="panel">
    <div class="legend">
      <span><span class="dot" style="background:#3b82f6"></span>Initial deposit</span>
      <span><span class="dot" style="background:#93c5fd"></span>Contributions</span>
      <span><span class="dot" style="background:#4ade80"></span>Interest earned</span>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>
</div>

<script>
  const fmt = v => '$' + Math.round(v).toLocaleString();
  const fmtK = v => v >= 1000000 ? '$' + (v/1000000).toFixed(1) + 'M' : v >= 1000 ? '$' + (v/1000).toFixed(0) + 'k' : '$' + Math.round(v);

  function calcData(principal, contrib, rate, years) {
    const labels = [], p_data = [], c_data = [], i_data = [];
    for (let y = 0; y <= years; y++) {
      let balance = principal * Math.pow(1 + rate / 100, y);
      let totalContrib = 0;
      if (contrib > 0 && y > 0) {
        totalContrib = contrib * ((Math.pow(1 + rate / 100, y) - 1) / (rate / 100));
        balance += totalContrib;
      }
      const interest = balance - principal - (contrib * y);
      labels.push(y === 0 ? 'Start' : 'Yr ' + y);
      p_data.push(Math.round(principal));
      c_data.push(Math.max(0, Math.round(contrib * y)));
      i_data.push(Math.max(0, Math.round(interest)));
    }
    return { labels, p_data, c_data, i_data };
  }

  let chart;
  function buildChart(principal, contrib, rate, years) {
    const { labels, p_data, c_data, i_data } = calcData(principal, contrib, rate, years);
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Initial deposit', data: p_data, backgroundColor: '#3b82f6', stack: 'a' },
          { label: 'Contributions',   data: c_data, backgroundColor: '#93c5fd', stack: 'a' },
          { label: 'Interest',        data: i_data, backgroundColor: '#4ade80', stack: 'a' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: {
            label: ctx => ' ' + ctx.dataset.label + ': ' + fmt(ctx.parsed.y),
            footer: items => ' Total: ' + fmt(items.reduce((s,i) => s + i.parsed.y, 0))
          }
        }},
        scales: {
          x: { stacked: true, ticks: { maxTicksLimit: 10, color: '#4a4845', font: { size: 11, family: 'DM Mono' } }, grid: { display: false }, border: { color: '#2e2d2a' } },
          y: { stacked: true, ticks: { color: '#4a4845', font: { size: 11, family: 'DM Mono' }, callback: v => fmtK(v) }, grid: { color: '#1a1916' }, border: { color: '#2e2d2a' } }
        }
      }
    });
  }

  function update() {
    const p = +document.getElementById('principal').value;
    const c = +document.getElementById('contrib').value;
    const r = +document.getElementById('rate').value;
    const y = +document.getElementById('years').value;

    document.getElementById('pOut').textContent = fmt(p);
    document.getElementById('cOut').textContent = fmt(c);
    document.getElementById('rOut').textContent = r + '%';
    document.getElementById('yOut').textContent = y + ' yrs';

    let balance = p * Math.pow(1 + r / 100, y);
    let totalContrib = 0;
    if (c > 0 && y > 0) {
      totalContrib = c * ((Math.pow(1 + r / 100, y) - 1) / (r / 100));
      balance += totalContrib;
    }
    const interest = balance - p - totalContrib;

    document.getElementById('statPrincipal').textContent = fmt(p);
    document.getElementById('statContrib').textContent = fmt(totalContrib);
    document.getElementById('statInterest').textContent = fmt(interest);
    document.getElementById('statFinal').textContent = fmt(balance);

    buildChart(p, c, r, y);
  }

  ['principal','contrib','rate','years'].forEach(id => document.getElementById(id).addEventListener('input', update));
  update();
</script>
</body>
</html>
