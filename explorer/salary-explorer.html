<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontario Take-Home Calculator 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #242320;
    --border: #2e2d2a;
    --text: #f0ede6;
    --text-muted: #7a7870;
    --text-dim: #4a4845;
    --green: #4ade80;
    --blue: #60a5fa;
    --blue-light: #93c5fd;
    --red: #f87171;
    --accent: #f59e0b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .container { max-width: 820px; margin: 0 auto; }

  header { margin-bottom: 48px; }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  header h1 em { font-style: italic; color: var(--accent); }
  header p { font-size: 13px; color: var(--text-muted); letter-spacing: 0.05em; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 16px;
  }
  .panel-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .salary-display {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 6vw, 60px);
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1;
  }
  .salary-display span { color: var(--accent); }

  input[type=range].salary-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    margin-bottom: 6px;
  }
  input[type=range].salary-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type=range].salary-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .salary-range { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); letter-spacing: 0.04em; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 14px;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .stat-value { font-size: 16px; font-weight: 500; letter-spacing: -0.02em; color: var(--text); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue-light); }

  .legend {
    display: flex;
    gap: 20px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 12px;
    flex-wrap: wrap;
    letter-spacing: 0.03em;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .chart-wrap { position: relative; width: 100%; height: 200px; }

  .section-header {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 20px 0 12px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .deduct-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    letter-spacing: -0.01em;
  }
  .deduct-row:last-child { border-bottom: none; }
  .deduct-label { color: var(--text-muted); }
  .deduct-val { font-weight: 500; }
  .deduct-val.neg { color: var(--red); }
  .deduct-val.pos { color: var(--green); }
  .deduct-row.total { font-weight: 500; padding-top: 12px; margin-top: 4px; border-top: 1px solid #3e3d3a; border-bottom: none; }
  .deduct-row.total .deduct-label { color: var(--text); }

  .brackets-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 24px 0 14px;
  }

  .br-row {
    display: grid;
    grid-template-columns: 180px 48px 1fr 80px;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .br-label { color: var(--text-dim); letter-spacing: 0.01em; }
  .br-label.active { color: var(--text-muted); }
  .br-rate { text-align: right; color: var(--text-dim); }
  .br-rate.active { color: var(--text-muted); font-weight: 500; }
  .br-track {
    background: var(--surface2);
    border-radius: 3px;
    height: 20px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
  }
  .br-fill { height: 100%; border-radius: 2px; transition: width 0.2s ease; }
  .br-fill-label {
    position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    font-size: 10px; font-weight: 500;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .br-amt { text-align: right; font-weight: 500; color: var(--text-muted); font-size: 12px; }
  .br-amt.dim { color: var(--text-dim); font-weight: 400; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .br-row { grid-template-columns: 130px 40px 1fr 70px; gap: 6px; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Ontario <em>take-home</em><br>calculator 2025</h1>
    <p>// federal + provincial tax · CPP · EI</p>
  </header>

  <div class="panel">
    <div class="panel-title">Annual salary</div>
    <div class="salary-display" id="salDisplay">$<span id="salNum">100,000</span></div>
    <input type="range" class="salary-slider" id="salary" min="20000" max="1000000" step="5000" value="100000">
    <div class="salary-range"><span>$20k</span><span>$1M</span></div>
  </div>

  <div class="stats" id="statsGrid"></div>

  <div class="panel">
    <div class="legend">
      <span><span class="dot" style="background:#3b82f6"></span>Federal tax</span>
      <span><span class="dot" style="background:#93c5fd"></span>Ontario tax</span>
      <span><span class="dot" style="background:#f87171"></span>CPP &amp; EI</span>
      <span><span class="dot" style="background:#4ade80"></span>Take-home</span>
    </div>
    <div class="chart-wrap"><canvas id="donut"></canvas></div>

    <div class="section-header">Deduction breakdown</div>
    <div id="deductRows"></div>
  </div>

  <div class="panel">
    <div class="two-col">
      <div>
        <div class="brackets-title">Federal brackets (2025)</div>
        <div id="fedBrackets"></div>
      </div>
      <div>
        <div class="brackets-title">Ontario brackets (2025)</div>
        <div id="onBrackets"></div>
      </div>
    </div>
  </div>
</div>

<script>
const fmt = v => '$' + Math.round(v).toLocaleString();

const FED_BRACKETS = [
  { min: 0,       max: 57375,   rate: 0.145, label: 'Up to $57,375' },
  { min: 57375,   max: 114750,  rate: 0.205, label: '$57k – $114k' },
  { min: 114750,  max: 177882,  rate: 0.26,  label: '$114k – $177k' },
  { min: 177882,  max: 253414,  rate: 0.29,  label: '$177k – $253k' },
  { min: 253414,  max: Infinity,rate: 0.33,  label: 'Over $253k' },
];
const ON_BRACKETS = [
  { min: 0,       max: 52886,   rate: 0.0505, label: 'Up to $52,886' },
  { min: 52886,   max: 105775,  rate: 0.0915, label: '$52k – $105k' },
  { min: 105775,  max: 150000,  rate: 0.1116, label: '$105k – $150k' },
  { min: 150000,  max: 220000,  rate: 0.1216, label: '$150k – $220k' },
  { min: 220000,  max: Infinity,rate: 0.1316, label: 'Over $220k' },
];

const FED_BPA = 16129, FED_CEA = 1433, ON_BPA = 12399;
const ON_ST1 = 5315, ON_ST2 = 6802;
const CPP_RATE = 0.0595, CPP_MAX_PENS = 71300, CPP_EXEMPT = 3500, CPP_MAX = 4034.10;
const CPP2_RATE = 0.04, CPP2_YMPE = 71300, CPP2_YAMPE = 81200, CPP2_MAX = 396;
const EI_RATE = 0.0166, EI_MAX_INS = 65700, EI_MAX = 1049.12;

function calcTax(income, brackets) {
  let tax = 0;
  for (const b of brackets) {
    if (income <= b.min) break;
    tax += (Math.min(income, b.max === Infinity ? income : b.max) - b.min) * b.rate;
  }
  return tax;
}
function calcFedTax(income) {
  return Math.max(0, calcTax(income, FED_BRACKETS) - FED_BPA * 0.145 - Math.min(income, FED_CEA) * 0.145);
}
function calcOnTax(income) {
  let basic = Math.max(0, calcTax(income, ON_BRACKETS) - ON_BPA * 0.0505);
  let surtax = 0;
  if (basic > ON_ST2) surtax = (basic - ON_ST2) * 0.36 + (ON_ST2 - ON_ST1) * 0.20;
  else if (basic > ON_ST1) surtax = (basic - ON_ST1) * 0.20;
  let ohp = 0;
  if (income > 200600) ohp = 900;
  else if (income > 200000) ohp = 750 + (income - 200000) * 0.25;
  else if (income > 72000) ohp = 750;
  else if (income > 48000) ohp = 450 + (income - 48000) * 0.025;
  else if (income > 36000) ohp = 300 + (income - 36000) * 0.025;
  else if (income > 20000) ohp = Math.min(300, (income - 20000) * 0.06);
  return basic + surtax + ohp;
}
function calcCPP(income) {
  const cpp1 = Math.min(Math.max(0, Math.min(income, CPP_MAX_PENS) - CPP_EXEMPT) * CPP_RATE, CPP_MAX);
  const cpp2 = income > CPP2_YMPE ? Math.min((Math.min(income, CPP2_YAMPE) - CPP2_YMPE) * CPP2_RATE, CPP2_MAX) : 0;
  return { cpp1, cpp2, total: cpp1 + cpp2 };
}
function calcEI(income) { return Math.min(Math.min(income, EI_MAX_INS) * EI_RATE, EI_MAX); }

function getMarginalRate(income) {
  let fedM = 0;
  for (const b of FED_BRACKETS) {
    if (income > b.min && income <= (b.max === Infinity ? Infinity : b.max)) { fedM = b.rate; break; }
  }
  let onM = 0;
  for (const b of ON_BRACKETS) {
    if (income > b.min && income <= (b.max === Infinity ? Infinity : b.max)) { onM = b.rate; break; }
  }
  const basicOnTax = Math.max(0, calcTax(income, ON_BRACKETS) - ON_BPA * 0.0505);
  let surtaxMult = 1;
  if (basicOnTax > ON_ST2) surtaxMult = 1.56;
  else if (basicOnTax > ON_ST1) surtaxMult = 1.20;
  let ohpM = 0;
  if (income > 200000 && income <= 200600) ohpM = 0.25;
  else if (income > 36000 && income <= 72000) ohpM = 0.025;
  else if (income > 20000 && income <= 36000) ohpM = 0.06;
  let cppEiM = 0;
  if (income <= CPP_MAX_PENS) cppEiM += CPP_RATE;
  if (income > CPP2_YMPE && income <= CPP2_YAMPE) cppEiM += CPP2_RATE;
  if (income <= EI_MAX_INS) cppEiM += EI_RATE;
  return (fedM + onM * surtaxMult + ohpM + cppEiM) * 100;
}

let chart;
function update() {
  const income = +document.getElementById('salary').value;
  document.getElementById('salNum').textContent = Math.round(income).toLocaleString();

  const cpp = calcCPP(income);
  const ei = calcEI(income);
  const fedCredit = (cpp.total + ei) * 0.145;
  const onCredit = (cpp.total + ei) * 0.0505;
  const fedTax = Math.max(0, calcFedTax(income) - fedCredit);
  const onTax = Math.max(0, calcOnTax(income) - onCredit);
  const totalDed = fedTax + onTax + cpp.total + ei;
  const takeHome = income - totalDed;
  const effRate = (totalDed / income * 100).toFixed(1);
  const marginal = getMarginalRate(income).toFixed(1);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><div class="stat-label">Total deductions</div><div class="stat-value red">−${fmt(totalDed)}</div></div>
    <div class="stat"><div class="stat-label">Take-home / yr</div><div class="stat-value green">${fmt(takeHome)}</div></div>
    <div class="stat"><div class="stat-label">Take-home / mo</div><div class="stat-value green">${fmt(Math.round(takeHome/12))}</div></div>
    <div class="stat"><div class="stat-label">Effective rate</div><div class="stat-value red">${effRate}%</div></div>
    <div class="stat"><div class="stat-label">Marginal rate</div><div class="stat-value blue">${marginal}%</div></div>
    <div class="stat"><div class="stat-label">Income tax only</div><div class="stat-value red">−${fmt(Math.round(fedTax+onTax))}</div></div>
  `;

  document.getElementById('deductRows').innerHTML = `
    <div class="deduct-row"><span class="deduct-label">Gross salary</span><span class="deduct-val pos">${fmt(income)}</span></div>
    <div class="deduct-row"><span class="deduct-label">Federal income tax</span><span class="deduct-val neg">−${fmt(Math.round(fedTax))}</span></div>
    <div class="deduct-row"><span class="deduct-label">Ontario provincial tax</span><span class="deduct-val neg">−${fmt(Math.round(onTax))}</span></div>
    <div class="deduct-row"><span class="deduct-label">CPP contributions</span><span class="deduct-val neg">−${fmt(Math.round(cpp.cpp1))}</span></div>
    ${cpp.cpp2 > 0 ? `<div class="deduct-row"><span class="deduct-label">CPP2 contributions</span><span class="deduct-val neg">−${fmt(Math.round(cpp.cpp2))}</span></div>` : ''}
    <div class="deduct-row"><span class="deduct-label">Employment Insurance (EI)</span><span class="deduct-val neg">−${fmt(Math.round(ei))}</span></div>
    <div class="deduct-row total"><span class="deduct-label">Take-home pay</span><span class="deduct-val pos">${fmt(Math.round(takeHome))}</span></div>
  `;

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('donut'), {
    type: 'doughnut',
    data: {
      labels: ['Federal tax', 'Ontario tax', 'CPP & EI', 'Take-home'],
      datasets: [{ data: [Math.round(fedTax), Math.round(onTax), Math.round(cpp.total+ei), Math.round(takeHome)], backgroundColor: ['#3b82f6','#93c5fd','#f87171','#4ade80'], borderWidth: 0 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + fmt(ctx.parsed) + ' (' + (ctx.parsed/income*100).toFixed(1) + '%)' } } }
    }
  });

  renderBrackets('fedBrackets', FED_BRACKETS, income, '#3b82f6');
  renderBrackets('onBrackets', ON_BRACKETS, income, '#93c5fd');
}

function renderBrackets(elId, brackets, income, color) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  brackets.forEach(b => {
    const inBracket = income > b.min;
    const bracketSize = b.max === Infinity ? Math.max(income - b.min, 1) : b.max - b.min;
    const amountInBracket = inBracket ? Math.min(income, b.max === Infinity ? income : b.max) - b.min : 0;
    const taxInBracket = amountInBracket * b.rate;
    const fillPct = inBracket ? Math.min(100, (amountInBracket / bracketSize) * 100) : 0;
    const showLabel = fillPct > 20;
    el.innerHTML += `
      <div class="br-row">
        <span class="br-label ${inBracket ? 'active' : ''}">${b.label}</span>
        <span class="br-rate ${inBracket ? 'active' : ''}">${(b.rate*100).toFixed(1)}%</span>
        <div class="br-track">
          <div class="br-fill" style="width:${fillPct}%;background:${inBracket ? color : '#2e2d2a'};"></div>
          ${showLabel ? `<span class="br-fill-label">${fmt(Math.round(amountInBracket))}</span>` : ''}
        </div>
        <span class="br-amt ${inBracket ? '' : 'dim'}">${inBracket ? fmt(Math.round(taxInBracket)) : '—'}</span>
      </div>`;
  });
}

document.getElementById('salary').addEventListener('input', update);
update();
</script>
</body>
</html>
